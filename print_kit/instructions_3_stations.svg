<?xml version="1.0" encoding="UTF-8"?>
<!--
  BLOOM — 3-STATION INSTRUCTIONS BOARD
  ─────────────────────────────────────────────────────
  Physical: 14" × 14" rounded square (356 × 356 mm)
  Material: birch plywood OR walnut · laser raster engrave
  Power:    ~70-80% on 60W CO2
  Mount:    entry wall, eye level

  Illustrator artboard: 14 × 14 inches portrait/square
  ─────────────────────────────────────────────────── -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 356 356"
     preserveAspectRatio="xMidYMid meet"
     style="background: #f5f1e8;">

  <rect width="356" height="356" fill="#f5f1e8"/>

  <!-- Optional rounded square cut line (red) — REMOVE if your board is already cut -->
  <rect x="3" y="3" width="350" height="350" rx="12" fill="none" stroke="#ff0000" stroke-width="0.4"/>


  <!-- ═══════ STATION 01 · WATCH ═══════ -->

  <text x="40" y="65" font-family="EB Garamond, Garamond, Georgia, serif"
        font-style="italic" font-weight="400" font-size="28" fill="#000">01</text>

  <text x="78" y="65" font-family="Helvetica, Arial, sans-serif"
        font-size="14" font-weight="500" letter-spacing="5" fill="#000">WATCH</text>

  <g font-family="EB Garamond, Garamond, Georgia, serif"
     font-weight="400" font-size="14" fill="#000">
    <text x="78" y="92">sit in the chair.</text>
    <text x="78" y="114">a sensor reads your stillness.</text>
    <text x="78" y="136" font-style="italic">watch the room respond.</text>
  </g>

  <!-- Divider 1 -->
  <line x1="100" y1="160" x2="256" y2="160" stroke="#000" stroke-width="0.5"/>
  <rect x="173" y="154" width="11" height="12" fill="#f5f1e8"/>
  <text x="178" y="164" text-anchor="middle"
        font-family="EB Garamond, serif" font-size="11" fill="#000">✻</text>


  <!-- ═══════ STATION 02 · STAY (Vision Pro) ═══════ -->

  <text x="40" y="200" font-family="EB Garamond, Garamond, Georgia, serif"
        font-style="italic" font-weight="400" font-size="28" fill="#000">02</text>

  <text x="78" y="200" font-family="Helvetica, Arial, sans-serif"
        font-size="14" font-weight="500" letter-spacing="5" fill="#000">STAY</text>

  <g font-family="EB Garamond, Garamond, Georgia, serif"
     font-weight="400" font-size="14" fill="#000">
    <text x="78" y="227">pick up the headset.</text>
    <text x="78" y="249">look at the marker.</text>
    <text x="78" y="271" font-style="italic">stay ninety seconds.</text>
  </g>

  <!-- Divider 2 -->
  <line x1="100" y1="295" x2="256" y2="295" stroke="#000" stroke-width="0.5"/>
  <rect x="173" y="289" width="11" height="12" fill="#f5f1e8"/>
  <text x="178" y="299" text-anchor="middle"
        font-family="EB Garamond, serif" font-size="11" fill="#000">✻</text>


  <!-- ═══════ STATION 03 · EXPRESS ═══════ -->

  <text x="40" y="335" font-family="EB Garamond, Garamond, Georgia, serif"
        font-style="italic" font-weight="400" font-size="28" fill="#000">03</text>

  <text x="78" y="335" font-family="Helvetica, Arial, sans-serif"
        font-size="14" font-weight="500" letter-spacing="5" fill="#000">EXPRESS</text>

</svg>
