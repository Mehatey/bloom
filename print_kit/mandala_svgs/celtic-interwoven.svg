    <ellipse cx="0" cy="0" rx="160" ry="55" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="160" ry="55" transform="rotate(135)"/>
    <ellipse cx="0" cy="0" rx="120" ry="35" transform="rotate(22.5)"/>
    <ellipse cx="0" cy="0" rx="120" ry="35" transform="rotate(67.5)"/>
    <ellipse cx="0" cy="0" rx="120" ry="35" transform="rotate(112.5)"/>
    <ellipse cx="0" cy="0" rx="120" ry="35" transform="rotate(157.5)"/>
