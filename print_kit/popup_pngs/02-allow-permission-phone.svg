<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460">
  <rect width="700" height="460" fill="#ffffff"/>
  <rect x="50" y="40" width="600" height="380" rx="28" fill="#ffffff" stroke="#000" stroke-width="6"/>

  <!-- Title -->
  <text x="350" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#000">BLOOM</text>

  <!-- Italic subtitle -->
  <text x="350" y="160" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-style="italic" font-size="28" fill="#000">Would Like Permission</text>
  <text x="350" y="195" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-style="italic" font-size="28" fill="#000">to Pick Up Your Phone.</text>

  <!-- Body -->
  <text x="350" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">Bloom needs to access your hands</text>
  <text x="350" y="272" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#000">to remind you of what you're missing.</text>

  <line x1="50" y1="335" x2="650" y2="335" stroke="#000" stroke-width="3"/>
  <line x1="350" y1="335" x2="350" y2="420" stroke="#000" stroke-width="3"/>

  <text x="200" y="385" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#000">Don't Allow</text>
  <text x="500" y="385" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#000">Allow</text>
</svg>