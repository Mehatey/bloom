<?xml version="1.0" encoding="UTF-8"?>
<!--
  CORK WALL PLAQUE — laser engrave
  ─────────────────────────────────────────────────────
  Physical size: 500mm × 280mm  (≈ 19.7" × 11")
  Material:      1/8" birch plywood OR cream acrylic
  Power:         ~70% on a 60W CO2 laser · raster engrave
  Mount:         top center of cork wall, ABOVE the cards

  BEFORE LASER:
    1. Open in Illustrator
    2. Select all <text> → Type → Create Outlines
    3. Engrave (no cut lines)

  PREVIEW: scales to fit browser. Real-world size is 500×280mm.
  ───────────────────────────────────────────────────── -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 280"
     preserveAspectRatio="xMidYMid meet"
     style="background: #f5f1e8;">

  <!-- ── HEADER · 'draw or write' — italic, centered, top -->
  <text x="250" y="60"
        text-anchor="middle"
        font-family="EB Garamond, Garamond, Georgia, serif"
        font-style="italic"
        font-weight="400"
        font-size="18"
        letter-spacing="0.04em"
        fill="#000000">draw or write</text>

  <!-- ── 3 PROMPTS · centered block, left-aligned within -->
  <g font-family="EB Garamond, Garamond, Georgia, serif" font-weight="400" font-size="22" fill="#000000">
    <text x="120" y="125">1 · something beautiful</text>
    <text x="120" y="165">2 · your happy place or person</text>
    <text x="120" y="205">3 · something you fear</text>
  </g>

  <!-- ── 'bloom · 2026' bottom right small -->
  <text x="475" y="262"
        text-anchor="end"
        font-family="EB Garamond, Garamond, Georgia, serif"
        font-weight="400"
        font-size="9"
        letter-spacing="0.15em"
        fill="#000000">bloom · 2026</text>

</svg>
